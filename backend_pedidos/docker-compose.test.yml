services:
  postgres-e2e:
    image: postgres:17
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: e2e_dummy_password
      POSTGRES_DB: pedidos_online_test
    volumes:
      - e2e_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d pedidos_online_test']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  e2e_pgdata: